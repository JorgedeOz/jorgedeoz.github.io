<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Jorge Eduardo López Hernández is a Senior Backend Engineer specializing in .NET, distributed systems, and cloud platforms."
    >
    <meta name="theme-color" content="#f5f7fa">
    <title>Resume</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
      try {
        const savedTheme = localStorage.getItem("resume-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
      } catch (error) {
        console.warn("Unable to load the saved theme preference.", error);
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <link rel="stylesheet" href="resume.css">
    <script src="resume-content.js" defer></script>
    <script src="theme.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="Home">
        <span class="brand-copy">
          <span class="brand-name" data-resume="profile.name"></span>
          <span class="brand-title" data-resume="profile.title"></span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#what-i-do">What I do</a>
        <a href="#experience">Experience</a>
        <a href="#skills">Skills</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          <span class="theme-toggle-label">Dark</span>
        </button>
      </nav>
    </header>

    <main id="main" aria-busy="true">
      <p class="resume-load-status" role="status">Loading resume…</p>
      <p class="resume-load-error" role="alert" hidden></p>

      <section class="section-shell section-block about-section" id="about" aria-label="About">
        <div class="section-heading">
          <p class="section-index">01 <span>/</span> About</p>
        </div>
        <div class="contact-links" aria-label="Contact links" data-resume-list="profileLinks"></div>
        <div class="about-content" data-resume-container="about"></div>
      </section>

      <section class="section-shell section-block what-i-do-section" id="what-i-do" aria-label="What I do">
        <p class="section-index">02 <span>/</span> What I do</p>
        <div class="what-i-do-grid" data-resume-list="whatIDo.items"></div>
      </section>

      <section class="experience-section" id="experience" aria-label="Experience">
        <div class="section-shell section-block">
          <p class="section-index">03 <span>/</span> Experience</p>
          <div class="timeline" data-resume-list="experience"></div>
        </div>
      </section>

      <section class="section-shell section-block skills-section" id="skills" aria-label="Skills and education">
        <p class="section-index">04 <span>/</span> Skills &amp; education</p>
        <div class="skills-content">
          <div class="skill-groups" data-resume-list="skills"></div>
          <aside class="education-card" data-resume-container="education"></aside>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <p>© <span data-resume="profile.copyrightYear"></span> <span data-resume="profile.name"></span></p>
    </footer>
  </body>
</html>
